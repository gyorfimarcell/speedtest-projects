<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <p class="round">Round <span id="roundNum">1</span></p>
      <p id="status"></p>
    </header>
    <main>
      <div class="grid">
        <button id="red" data-idx="0" aria-label="Red"></button>
        <button id="blue" data-idx="1" aria-label="Blue"></button>
        <button id="yellow" data-idx="2" aria-label="Yellow"></button>
        <button id="green" data-idx="3" aria-label="Green"></button>
      </div>
    </main>
  </body>
</html>
